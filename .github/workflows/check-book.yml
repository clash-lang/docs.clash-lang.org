name: Check book examples

on:
  pull_request:
  push:
  schedule:
    # Exercise the moving Clash master branch once a week, outside peak hours.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  releases:
    if: github.event_name != 'schedule'
    name: Clash ${{ matrix.clash-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - clash-version: 1.8.5
            flake-package: book-clash-1_8_5
          - clash-version: "1.10"
            flake-package: book-clash-1_10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
        with:
          extra-conf: |
            extra-substituters = https://clash-lang.cachix.org
            extra-trusted-public-keys = clash-lang.cachix.org-1:/2N1uka38B/heaOAC+Ztd/EWLmF0RLfizWgC5tamCBg=

      - name: Enable Nix cache
        uses: DeterminateSystems/flakehub-cache-action@3be0931021788e3bb4df65f59a555039c2fa2d46 # v3.21.7

      - name: Build book
        run: nix build ".#${{ matrix.flake-package }}" --print-build-logs

  clash-master:
    name: Clash master
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
        with:
          extra-conf: |
            extra-substituters = https://clash-lang.cachix.org
            extra-trusted-public-keys = clash-lang.cachix.org-1:/2N1uka38B/heaOAC+Ztd/EWLmF0RLfizWgC5tamCBg=

      - name: Enable Nix cache
        uses: DeterminateSystems/flakehub-cache-action@3be0931021788e3bb4df65f59a555039c2fa2d46 # v3.21.7

      - name: Update Clash master
        run: >-
          nix flake lock
          --override-input clash-master
          github:clash-lang/clash-compiler/master

      - name: Show selected Clash revision
        run: nix flake metadata --json | jq -r '.locks.nodes["clash-master"].locked.rev'

      - name: Build book
        run: nix build .#book-clash-master --print-build-logs
